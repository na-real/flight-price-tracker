<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>404 Page Not Found — SkyTrack</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="spatial-bg-ambient">
        <div class="spatial-glow glow-top"></div>
    </div>

    <div class="app">
        <header class="navbar-wrapper">
            <nav class="navbar">
                <a href="/" class="logo" aria-label="SkyTrack Home">
                    <span class="logo-mark">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.3c.4-.2.6-.6.5-1.1z" />
                        </svg>
                    </span>
                    <span class="logo-text">SkyTrack</span>
                </a>
            </nav>
        </header>

        <main
            style="min-height: 60vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
            <div class="search-card" style="max-width: 540px; width: 100%; text-align: center; padding: 48px 36px;">
                <div class="hero-badge" style="margin: 0 auto 18px auto;">
                    <span class="hero-badge-text">STATUS 404</span>
                </div>

                <h1
                    style="font-size: 2.2rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 12px; color: var(--text-primary);">
                    Lost in transit.
                </h1>

                <p style="color: var(--text-secondary); font-size: 0.95rem; line-height: 1.6; margin-bottom: 32px;">
                    The route or page you requested could not be located. It may have moved or been decommissioned.
                </p>

                <div style="display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;">
                    <a href="/" class="primary-btn" style="text-decoration: none;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        <span>Return to Flight Search</span>
                    </a>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <div class="footer-content">
                <div class="footer-brand">
                    <span>SkyTrack</span>
                </div>
                <p class="footer-note">Spatial flight price intelligence platform. Designed for precision travel.</p>
            </div>
        </footer>
    </div>
</body>

</html>
