<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none" width="100%" height="100%">
    <!-- Minimalist Luxury Symbol (48x48) -->
    <g id="brandSymbol">
        <!-- Orbital Horizon Ellipse -->
        <ellipse cx="24" cy="24" rx="19" ry="8.5" transform="rotate(-28 24 24)" stroke="#DFC99E" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Continuous S Flight Trajectory -->
        <path d="M 33 13 C 26 8, 16 11, 16 19 C 16 26, 32 22, 32 29 C 32 37, 22 40, 15 35" stroke="#DFC99E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <!-- Celestial Navigation Coordinate Point -->
        <circle cx="34" cy="15" r="2.2" fill="#DFC99E"/>
    </g>

    <!-- Wordmark & Subtitle -->
    <g transform="translate(58, 0)">
        <text x="0" y="24" font-family="'Cinzel', 'Cormorant Garamond', Georgia, serif" font-size="18" font-weight="600" letter-spacing="0.14em" fill="#F6F5F2">
            SKYTRACKER
        </text>
        <text x="1" y="37" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.32em" fill="#DFC99E">
            FLIGHT INTELLIGENCE
        </text>
    </g>
</svg>
